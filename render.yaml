# Render.com blueprint — deploy the XAUUSD AI Signal Desk for free
# Push this folder to GitHub, then in Render: New → Blueprint → select the repo.
services:
  - type: web
    name: xauusd-ai-signal-desk
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false        # optional: set in the Render dashboard
      - key: TELEGRAM_CHAT_ID
        sync: false
